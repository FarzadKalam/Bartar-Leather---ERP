name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: erp-mehrbanoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test catalog, inventory and production
        run: |
          npm run test:product-catalog
          npm install --prefix .tmp-tests/pg-validation --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.11
          node tests/productionOperations.test.mjs
          node tests/productionStageShelfGuard.test.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production database
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$PRODUCTION_DATABASE_URL" ]]; then
            needs_migration=$(psql "$PRODUCTION_DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.commit_production_operation(jsonb)') is null")
            if [[ "$needs_migration" == t ]]; then
              psql "$PRODUCTION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/20261114_production_operations.sql
            fi
          fi
          node scripts/check-production-schema.mjs

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Pack dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: 212.23.201.161
          SERVER_PORT: '22'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload bundle
        env:
          SERVER_HOST: 212.23.201.161
          SERVER_PORT: '22'
          SERVER_USER: deploy
        run: |
          timeout 60 scp -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SERVER_PORT" dist.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/erp-mehrbanoo-dist.tar.gz"

      - name: Activate release
        env:
          SERVER_HOST: 212.23.201.161
          SERVER_PORT: '22'
          SERVER_USER: deploy
          DEPLOY_PATH: /var/www/erp-mehrbanoo
        run: |
          # Note: SSH does not forward env vars by default, so we pass DEPLOY_PATH explicitly.
          timeout 60 ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/erp-mehrbanoo}"
          ARCHIVE="/tmp/erp-mehrbanoo-dist.tar.gz"
          TS="$(date +%Y%m%d%H%M%S)"

          mkdir -p "$DEPLOY_PATH/releases"
          RELEASE_DIR="$DEPLOY_PATH/releases/$TS"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

          # Keep last 5 releases for quick rollback.
          if [ -d "$DEPLOY_PATH/releases" ]; then
            ls -1dt "$DEPLOY_PATH/releases"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          fi

          # Reload nginx if allowed for this user.
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl reload nginx || true
          fi

          echo "Deployed $RELEASE_DIR"
          EOF
