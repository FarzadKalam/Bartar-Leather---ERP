# Public HTTPS gateway for the self-hosted Supabase API.
#
# Prerequisite: api-mehrbanoo.tazesystem.ir must have an A record pointing to
# 212.23.201.161. This proxy expects Supabase Kong to listen locally on port 8000.

server {
    listen 80;
    listen [::]:80;
    server_name api-mehrbanoo.tazesystem.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
